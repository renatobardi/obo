# SonarQube Cloud – Automatic Analysis configuration.

# The i18n locale bundles under frontend/src/lib/locales/ are 14 structurally
# parallel translation dictionaries: every file must carry the same key set
# (enforced by `satisfies TranslationShape` and the parity test). Adding a key
# therefore means repeating it across all 14 files by design — this is not
# copy-paste that could be refactored away, so exclude the directory from
# copy-paste / duplication detection.
sonar.cpd.exclusions=frontend/src/lib/locales/**
